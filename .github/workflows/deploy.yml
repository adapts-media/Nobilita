name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /var/www/nobilita
            git fetch origin main
            git reset --hard origin/main
            # The build occasionally fails on a transient Google Fonts fetch
            # timeout (unrelated to the code) — retry once before giving up,
            # since a failed build here must never reach pm2 restart below.
            npm run build || npm run build
            pm2 restart nobilita
            sleep 3
            curl -sf -o /dev/null http://localhost:3001/ && echo "OK"

  # Schema migrations (prisma db push --accept-data-loss) are intentionally
  # NOT run automatically here — that flag can silently drop columns/data,
  # so it stays a manual SSH step whenever a change actually touches
  # prisma/schema.prisma, same as before this pipeline existed.
